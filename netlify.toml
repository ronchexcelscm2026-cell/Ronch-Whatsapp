[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/catalogues.json"]

# PDFs: let WhatsApp fetch them quickly and cache them
[[headers]]
  for = "/catalogues/*"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=3600"

# Lead list page
[[redirects]]
  from = "/leads"
  to = "/.netlify/functions/leads"
  status = 200

# Short catalogue links for the WhatsApp greeting message
[[redirects]]
  from = "/c"
  to = "/catalogue.html"
  status = 200

[[redirects]]
  from = "/c/facade"
  to = "/catalogues/Facade.pdf"
  status = 302

[[redirects]]
  from = "/c/landscape"
  to = "/catalogues/Landscape.pdf"
  status = 302

[[redirects]]
  from = "/c/solar"
  to = "/catalogues/Solar.pdf"
  status = 302

[[redirects]]
  from = "/c/drivers"
  to = "/catalogues/LED-Drivers.pdf"
  status = 302

[[redirects]]
  from = "/c/indoor"
  to = "/catalogues/Indoor.pdf"
  status = 302
