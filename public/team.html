<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#01517E">
<title>Ronch Stand Leads</title>
<style>
  :root { --blue:#01517E; --green:#36941E; --ink:#15232c; --muted:#5b6b75; --line:#d3dde3; --bg:#f2f5f7; --card:#fff;
          --hot:#c45600; --hot-s:#fbe4d0; --warm:#8f6b00; --warm-s:#f5e9bf; --cold:#2b67b0; --cold-s:#dae7f6; --err:#b3261e; --fill:#e4f3df; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header b { font-size:18px; letter-spacing:.3px; } header b span { color:#9be07f; }
  header small { opacity:.85; font-size:13px; }
  main { max-width:620px; margin:0 auto; padding:14px 16px 170px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  h2 { margin:0 0 10px; font-size:17px; }
  label { display:block; font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 0 5px; }
  input, select, textarea { width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); min-height:46px; font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--blue); outline-offset:1px; }
  .filled { background:var(--fill) !important; border-color:var(--green) !important; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:420px) { .row { grid-template-columns:1fr; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:16px; font-weight:bold; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.green { background:var(--green); border-color:var(--green); color:#fff; }
  .btn:disabled { opacity:.5; }
  .scanbtn { width:100%; min-height:64px; font-size:18px; background:var(--green); border-color:var(--green); color:#fff; }
  .thumbs { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .thumbs img { height:70px; border-radius:6px; border:1px solid var(--line); }
  .status { margin-top:10px; padding:10px 12px; border-radius:8px; font-size:14px; background:#e3eef6; color:var(--blue); }
  .status.err { background:#fde2e1; color:var(--err); }
  .status.ok { background:var(--fill); color:#1f6b0e; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:15px; cursor:pointer; color:var(--ink); }
  .chip[aria-pressed="true"] { background:#dcebf5; border-color:var(--blue); color:var(--blue); font-weight:bold; }
  .chip[aria-pressed="true"]::before { content:"✓ "; }
  .temps { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .temp { min-height:48px; border-radius:8px; border:1px solid var(--line); background:#fff; font-weight:bold; font-size:15px; cursor:pointer; }
  .temp[data-t="hot"][aria-pressed="true"] { background:var(--hot-s); border-color:var(--hot); color:var(--hot); }
  .temp[data-t="warm"][aria-pressed="true"] { background:var(--warm-s); border-color:var(--warm); color:var(--warm); }
  .temp[data-t="cold"][aria-pressed="true"] { background:var(--cold-s); border-color:var(--cold); color:var(--cold); }
  .consent { display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:15px; text-transform:none; letter-spacing:0; font-weight:normal; color:var(--ink); }
  .consent input { width:24px; height:24px; min-height:0; flex:none; margin-top:1px; }
  .bar { position:fixed; left:0; right:0; bottom:calc(62px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); padding:10px 16px; z-index:5; }
  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  .tabs .in { max-width:620px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; }
  .tab { min-height:62px; background:none; border:0; font-size:14px; font-weight:bold; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .tab span { font-size:22px; line-height:1; }
  .tab[aria-selected="true"] { color:var(--blue); box-shadow:inset 0 3px 0 var(--blue); }
  .tab .count { font-size:11px; background:var(--blue); color:#fff; border-radius:999px; padding:1px 7px; margin-left:4px; }
  .tools { display:grid; gap:10px; margin-bottom:12px; }
  .tools .line { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tools .line .btn { min-height:42px; padding:0 12px; font-size:14px; }
  .fchip { min-height:38px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:14px; cursor:pointer; color:var(--ink); }
  .fchip[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
  .stats { font-size:13px; color:var(--muted); margin:2px 0 10px; }
  .lead { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .lead .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; cursor:pointer; }
  .lead .nm { font-weight:bold; font-size:16px; }
  .lead .sub { color:var(--muted); font-size:14px; margin-top:2px; }
  .lead .when { color:var(--muted); font-size:12px; white-space:nowrap; text-align:right; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .tg { font-size:12px; font-weight:bold; padding:3px 8px; border-radius:999px; background:#eef2f5; color:var(--ink); }
  .tg.hot { background:var(--hot-s); color:var(--hot); } .tg.warm { background:var(--warm-s); color:var(--warm); } .tg.cold { background:var(--cold-s); color:var(--cold); }
  .tg.src { background:#e3eef6; color:var(--blue); } .tg.call { background:#fbe4d0; color:#a34700; } .tg.err { background:#fde2e1; color:var(--err); }
  .lead .more { margin-top:10px; font-size:14px; line-height:1.55; border-top:1px dashed var(--line); padding-top:8px; }
  .lead .more b { color:var(--muted); font-weight:bold; }
  .lead .acts { display:flex; gap:8px; margin-top:10px; }
  .lead .acts .btn { flex:1; min-height:42px; font-size:14px; }
  .lead .acts .btn { padding:0 8px; }
  .sendbox { margin-top:10px; padding:10px; border-radius:10px; background:#f3f7fa; border:1px solid var(--line); }
  .sendbox .lbl { font-size:13px; font-weight:bold; color:var(--muted); margin-bottom:8px; }
  .sendbox .chip { min-height:38px; font-size:14px; }
  .sendbox small { font-weight:normal; opacity:.75; }
  .sendmsg { margin-top:10px; font-size:14px; line-height:1.5; }
  .sendmsg .good { color:var(--green); font-weight:bold; } .sendmsg .bad { color:var(--err); }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  .bar .in { max-width:620px; margin:0 auto; display:flex; gap:10px; }
  .bar .btn { flex:1; }
  .hidden { display:none !important; }
  .login { max-width:420px; margin:40px auto; }
  .muted { color:var(--muted); font-size:14px; }
  .done-list { margin:8px 0 0; padding-left:20px; }
  .tmp-note { font-size:13px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <div><b>RONCH <span>EXCEL</span></b><br><small>Stand leads · Acetech 2026</small></div>
  <small id="who"></small>
</header>

<!-- LOGIN -->
<main id="loginView" class="hidden">
  <div class="card login">
    <h2>Team sign in</h2>
    <label for="lgKey">Team password</label>
    <input id="lgKey" type="password" autocomplete="current-password">
    <label for="lgName">Your name</label>
    <input id="lgName" type="text" autocapitalize="words" placeholder="e.g. Rahul">
    <div id="lgMsg" class="status err hidden"></div>
    <div style="margin-top:14px"><button class="btn primary" id="lgBtn" style="width:100%">Start</button></div>
  </div>
</main>

<!-- FORM -->
<main id="formView" class="hidden">
  <div class="card">
    <h2>1 · Scan visiting card</h2>
    <button class="btn scanbtn" id="scanFront">📷 Scan card (front)</button>
    <input id="fileFront" type="file" accept="image/*" capture="environment" class="hidden">
    <input id="fileBack" type="file" accept="image/*" capture="environment" class="hidden">
    <div class="thumbs" id="thumbs"></div>
    <div style="margin-top:10px" class="hidden" id="backRow"><button class="btn" id="scanBack">＋ Add back side</button></div>
    <div id="scanMsg" class="status hidden"></div>
  </div>

  <div class="card">
    <h2>2 · Visitor details</h2>
    <label for="f-name">Name *</label><input id="f-name" autocapitalize="words">
    <div class="row">
      <div><label for="f-mobile">Mobile (WhatsApp) *</label><input id="f-mobile" type="tel" inputmode="tel" placeholder="98xxxxxxxx"></div>
      <div><label for="f-email">Email</label><input id="f-email" type="email" inputmode="email" autocapitalize="none"></div>
    </div>
    <div class="row">
      <div><label for="f-company">Company</label><input id="f-company" autocapitalize="words"></div>
      <div><label for="f-designation">Designation</label><input id="f-designation" autocapitalize="words"></div>
    </div>
    <div class="row">
      <div><label for="f-city">City</label><input id="f-city" autocapitalize="words"></div>
      <div><label for="f-type">Visitor type</label>
        <select id="f-type"><option value="">Select</option><option>Architect</option><option>Lighting designer</option><option>Builder / developer</option><option>Contractor</option><option>Dealer / distributor</option><option>Consultant</option><option>Panel builder / OEM</option><option>End client</option><option>Other</option></select></div>
    </div>
  </div>

  <div class="card">
    <h2>3 · Interest</h2>
    <label>Catalogues to send</label>
    <div class="chips" id="interests"></div>
    <label>Project types <span style="text-transform:none;font-weight:normal">(tap all that apply)</span></label>
    <div class="chips" id="ptypes"></div>
    <input id="f-ptype-other" class="hidden" placeholder="Other project type" style="margin-top:8px">
    <label for="f-timeline">Timeline</label>
    <select id="f-timeline"><option value="">Not sure</option><option>Immediate</option><option>Within 1 month</option><option>1 to 3 months</option><option>3 to 6 months</option><option>6+ months</option><option>Just exploring</option></select>
    <label for="f-qty">Quantity / size</label><input id="f-qty" placeholder="e.g. 400 m linear, 60 nos">
    <label>Lead</label>
    <div class="temps">
      <button type="button" class="temp" data-t="hot" aria-pressed="false">Hot</button>
      <button type="button" class="temp" data-t="warm" aria-pressed="true">Warm</button>
      <button type="button" class="temp" data-t="cold" aria-pressed="false">Cold</button>
    </div>
    <label for="f-notes">Notes</label><textarea id="f-notes" placeholder="Project, site, budget, next step"></textarea>
    <label class="consent"><input type="checkbox" id="f-consent" checked><span>Visitor agreed to receive the catalogues on WhatsApp</span></label>
    <div class="tmp-note" id="tmpNote"></div>
    <div class="hidden" id="setupRow" style="margin-top:10px"><button class="btn" id="setupBtn">Set up automatic sending (one time)</button></div>
  </div>

  <div id="resultCard" class="card hidden"></div>
</main>

<!-- LEADS -->
<main id="leadsView" class="hidden">
  <div class="tools">
    <input id="q" type="search" placeholder="Search name, company, mobile, city">
    <div class="line" id="tempF">
      <button class="fchip" data-f="all" aria-pressed="true">All</button>
      <button class="fchip" data-f="hot" aria-pressed="false">Hot</button>
      <button class="fchip" data-f="warm" aria-pressed="false">Warm</button>
      <button class="fchip" data-f="cold" aria-pressed="false">Cold</button>
      <button class="fchip" data-f="call" aria-pressed="false">Call back</button>
    </div>
    <div class="line">
      <select id="srcF" style="flex:1;min-width:140px"><option value="all">All sources</option><option value="Stand team">Stand team</option><option value="WhatsApp QR">WhatsApp QR</option><option value="mine">Only mine</option></select>
      <button class="btn" id="refreshBtn">↻ Refresh</button>
      <button class="btn" id="csvBtn">⬇ CSV</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="leadList"></div>
</main>

<nav class="tabs hidden" id="tabs"><div class="in" role="tablist">
  <button class="tab" role="tab" data-tab="scan" aria-selected="true"><span>📷</span>Card Scan</button>
  <button class="tab" role="tab" data-tab="leads" aria-selected="false"><span>📋</span><div>Leads<b class="count hidden" id="leadCount"></b></div></button>
</div></nav>

<div class="bar hidden" id="bar"><div class="in">
  <button class="btn" id="clearBtn">Clear</button>
  <button class="btn primary" id="submitBtn">Submit &amp; send</button>
</div></div>

<script>
(function () {
  'use strict';
  var DIVS = [['facade', 'Facade and Landscape Lighting'], ['solar', 'Solar Lighting'], ['drivers', 'LED Drivers (CV/CC)'], ['projection', 'Projection Mapping'], ['displays', 'LED Displays']];
  var $ = function (s) { return document.querySelector(s); };
  var S = { key: '', staff: '', imgs: [null, null], temp: 'warm', interests: new Set(), busy: false, scanCtl: 0 };
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function show(el, on) { el.classList.toggle('hidden', !on); }
  function msg(el, text, kind) { el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); show(el, !!text); }

  async function api(path, body) {
    var r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var d = {}; try { d = await r.json(); } catch (e) {}
    if (!r.ok || !d.ok) throw new Error(d.error || ('Error ' + r.status));
    return d;
  }

  /* ---------- login ---------- */
  function startForm() {
    show($('#loginView'), false); show($('#tabs'), true); setTab(ls('rt_tab') || 'scan');
    $('#who').textContent = S.staff ? 'Signed in: ' + S.staff : '';
  }
  async function login(key, staff, silent) {
    try {
      var d = await api('/.netlify/functions/team', { action: 'login', key: key });
      S.key = key; S.staff = staff; ls('rt_key', key); ls('rt_staff', staff);
      setTemplateNote(d.template); startForm();
    } catch (e) {
      if (silent) { show($('#loginView'), true); return; }
      msg($('#lgMsg'), e.message, 'err');
    }
  }
  function setTemplateNote(t) {
    var s = t && t.status;
    show($('#setupRow'), s === 'NOT_CREATED' || s === 'REJECTED');
    $('#tmpNote').textContent = s === 'APPROVED' ? 'Catalogues go out automatically from +91 88662 73800.'
      : 'Automatic WhatsApp sending is ' + (s === 'NOT_CREATED' ? 'not set up yet' : 'waiting for Meta approval') + ' — after Submit you\'ll get a one-tap WhatsApp button instead.';
  }
  $('#lgBtn').addEventListener('click', function () {
    var k = $('#lgKey').value.trim(), n = $('#lgName').value.trim();
    if (!k || !n) { msg($('#lgMsg'), 'Enter the team password and your name.', 'err'); return; }
    login(k, n, false);
  });

  $('#setupBtn').addEventListener('click', async function () {
    this.disabled = true; this.textContent = 'Setting up…';
    try { var d = await api('/.netlify/functions/team', { action: 'setup', key: S.key }); setTemplateNote(d.template); $('#tmpNote').textContent += ' (status: ' + d.template.status + ')'; }
    catch (e) { $('#tmpNote').textContent = 'Setup failed: ' + e.message; this.disabled = false; this.textContent = 'Set up automatic sending (one time)'; }
  });

  /* ---------- chips ---------- */
  $('#interests').innerHTML = DIVS.map(function (d) { return '<button type="button" class="chip" data-id="' + d[0] + '" aria-pressed="false">' + d[1] + '</button>'; }).join('');
  $('#interests').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
    if (on) S.interests.add(b.dataset.id); else S.interests.delete(b.dataset.id);
  });
  var PTYPES = ['Residential', 'Villa / bungalow', 'Commercial / office', 'Hospitality / hotel', 'Retail / showroom', 'Hospital / institution', 'Religious / heritage', 'Industrial', 'Infrastructure / bridge', 'Public / government', 'Landscape / garden', 'Other'];
  var PT = new Set();
  $('#ptypes').innerHTML = PTYPES.map(function (t) { return '<button type="button" class="chip" data-pt="' + t + '" aria-pressed="false">' + t + '</button>'; }).join('');
  $('#ptypes').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
    if (on) PT.add(b.dataset.pt); else PT.delete(b.dataset.pt);
    show($('#f-ptype-other'), PT.has('Other')); if (on && b.dataset.pt === 'Other') $('#f-ptype-other').focus();
  });
  function projectTypes() {
    return PTYPES.filter(function (t) { return PT.has(t); }).map(function (t) {
      var o = $('#f-ptype-other').value.trim(); return t === 'Other' && o ? 'Other: ' + o : t;
    }).join(', ');
  }
  document.querySelectorAll('.temp').forEach(function (b) {
    b.addEventListener('click', function () { S.temp = b.dataset.t; document.querySelectorAll('.temp').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); });
  });

  /* ---------- card scan ---------- */
  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('bad image')); };
      img.src = url;
    });
  }
  function renderThumbs() { $('#thumbs').innerHTML = S.imgs.filter(Boolean).map(function (s) { return '<img src="' + s + '" alt="Visiting card">'; }).join(''); }
  var MAP = { name: '#f-name', company: '#f-company', designation: '#f-designation', mobile: '#f-mobile', email: '#f-email', city: '#f-city' };
  S.extra = {};
  async function scan(force) {
    var imgs = S.imgs.filter(Boolean); if (!imgs.length) return;
    var my = ++S.scanCtl, t0 = Date.now();
    msg($('#scanMsg'), 'Reading the card…');
    var timer = setInterval(function () { if (my === S.scanCtl) msg($('#scanMsg'), 'Reading the card… ' + Math.round((Date.now() - t0) / 1000) + ' s'); }, 1000);
    try {
      var d = await api('/.netlify/functions/scan', { key: S.key, images: imgs });
      clearInterval(timer); if (my !== S.scanCtl) return;
      var f = d.fields || {}, n = 0;
      Object.keys(MAP).forEach(function (k) {
        var v = (f[k] || '').trim(), el = $(MAP[k]);
        if (!v) return; if (el.value.trim() && !force) return;
        el.value = v; el.classList.add('filled'); n++;
      });
      if (!$('#f-mobile').value.trim() && f.otherPhones) { $('#f-mobile').value = f.otherPhones.split(',')[0].trim(); $('#f-mobile').classList.add('filled'); n++; }
      S.extra = { otherPhones: f.otherPhones || '', address: f.address || '', website: f.website || '' };
      msg($('#scanMsg'), n ? 'Filled ' + n + ' fields (green). Please check them.' : 'Could not read details. Retake the photo closer, in good light, or type them.', n ? 'ok' : 'err');
    } catch (e) {
      clearInterval(timer); if (my !== S.scanCtl) return;
      msg($('#scanMsg'), e.message + ' You can type the details instead.', 'err');
    }
  }
  $('#scanFront').addEventListener('click', function () { $('#fileFront').click(); });
  $('#scanBack').addEventListener('click', function () { $('#fileBack').click(); });
  $('#fileFront').addEventListener('change', async function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    try { S.imgs = [await shrink(f), null]; } catch (err) { msg($('#scanMsg'), 'That photo could not be used. Try again.', 'err'); return; }
    renderThumbs(); show($('#backRow'), true); $('#scanFront').textContent = '📷 Retake card (front)'; e.target.value = ''; scan(false);
  });
  $('#fileBack').addEventListener('change', async function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    try { S.imgs[1] = await shrink(f); } catch (err) { return; }
    renderThumbs(); show($('#backRow'), false); e.target.value = ''; scan(true);
  });
  document.addEventListener('input', function (e) { if (e.target.classList && e.target.classList.contains('filled')) e.target.classList.remove('filled'); });

  /* ---------- submit ---------- */
  function resetForm() {
    S.scanCtl++; S.imgs = [null, null]; S.extra = {}; S.interests.clear(); PT.clear(); show($('#f-ptype-other'), false); S.temp = 'warm';
    ['#f-name','#f-mobile','#f-email','#f-company','#f-designation','#f-city','#f-qty','#f-notes'].forEach(function (s) { $(s).value = ''; $(s).classList.remove('filled'); });
    ['#f-type','#f-timeline','#f-ptype-other'].forEach(function (s) { $(s).value = ''; });
    $('#f-consent').checked = true;
    document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
    document.querySelectorAll('.temp').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.t === 'warm'); });
    renderThumbs(); show($('#backRow'), false); msg($('#scanMsg'), ''); $('#scanFront').textContent = '📷 Scan card (front)';
    show($('#resultCard'), false); window.scrollTo(0, 0);
  }
  $('#clearBtn').addEventListener('click', resetForm);
  $('#submitBtn').addEventListener('click', async function () {
    if (S.busy) return;
    var name = $('#f-name').value.trim(), mob = $('#f-mobile').value.trim();
    var rc = $('#resultCard');
    if (!name || !mob) { rc.innerHTML = '<div class="status err">Enter at least the name and mobile number.</div>'; show(rc, true); rc.scrollIntoView({ behavior: 'smooth' }); return; }
    if ($('#f-consent').checked && !S.interests.size) { rc.innerHTML = '<div class="status err">Tick at least one catalogue to send (or untick the WhatsApp box).</div>'; show(rc, true); rc.scrollIntoView({ behavior: 'smooth' }); return; }
    S.busy = true; $('#submitBtn').disabled = true; $('#submitBtn').textContent = 'Saving…';
    try {
      var d = await api('/.netlify/functions/team', {
        action: 'submit', key: S.key, staff: S.staff, consent: $('#f-consent').checked,
        lead: {
          name: name, mobile: mob, email: $('#f-email').value, company: $('#f-company').value, designation: $('#f-designation').value,
          city: $('#f-city').value, visitorType: $('#f-type').value, projectType: projectTypes(), timeline: $('#f-timeline').value,
          qty: $('#f-qty').value, notes: $('#f-notes').value, temp: S.temp, interests: Array.from(S.interests),
          otherPhones: S.extra.otherPhones, address: S.extra.address, website: S.extra.website
        }
      });
      var html = '<h2>✅ Saved: ' + name.replace(/[<>&]/g, '') + '</h2>';
      if (d.sent && d.sent.length) {
        html += '<ul class="done-list">' + d.sent.map(function (x) { return '<li>' + x.title + (x.ok ? ' — sent on WhatsApp' : ' — <b>not sent</b>') + '</li>'; }).join('') + '</ul>';
      }
      if (d.note) html += '<p class="muted">' + d.note + '</p>';
      if (d.waLink) html += '<p><a class="btn green" target="_blank" rel="noopener" href="' + d.waLink + '">Send catalogues from this phone (WhatsApp)</a></p>';
      html += '<p><button class="btn primary" id="nextBtn" style="width:100%">Next visitor</button></p>';
      rc.innerHTML = html; show(rc, true); rc.scrollIntoView({ behavior: 'smooth' });
      $('#nextBtn').addEventListener('click', resetForm);
      api('/.netlify/functions/team', { action: 'list', key: S.key }).then(function (d) { L.all = d.leads || []; var c = $('#leadCount'); c.textContent = L.all.length; show(c, L.all.length > 0); }).catch(function () {});
    } catch (e) {
      rc.innerHTML = '<div class="status err">Not saved: ' + e.message + '. Check the network and try again.</div>'; show(rc, true);
    } finally {
      S.busy = false; $('#submitBtn').disabled = false; $('#submitBtn').textContent = 'Submit & send';
    }
  });

  /* ---------- tabs ---------- */
  function setTab(t) {
    ls('rt_tab', t);
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === t); });
    show($('#formView'), t === 'scan'); show($('#bar'), t === 'scan'); show($('#leadsView'), t === 'leads');
    window.scrollTo(0, 0);
    if (t === 'leads') loadLeads();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });

  /* ---------- leads ---------- */
  var L = { all: [], temp: 'all', open: {} };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function when(iso) { return iso ? new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; }
  async function loadLeads() {
    $('#stats').textContent = 'Loading…';
    try { var d = await api('/.netlify/functions/team', { action: 'list', key: S.key }); L.all = d.leads || []; renderLeads(); }
    catch (e) { $('#stats').textContent = 'Could not load leads: ' + e.message; }
  }
  function filtered() {
    var q = $('#q').value.trim().toLowerCase(), src = $('#srcF').value, qd = q.replace(/\D/g, '');
    return L.all.filter(function (l) {
      if (L.temp === 'call' && !l.callBack) return false;
      if (['hot', 'warm', 'cold'].indexOf(L.temp) >= 0 && l.temp !== L.temp) return false;
      if (src === 'mine' && l.staff !== S.staff) return false;
      if (src !== 'all' && src !== 'mine' && l.source !== src) return false;
      if (q) {
        var hay = [l.name, l.waName, l.company, l.city, l.email, l.designation, l.notes].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0 && !(qd.length >= 4 && String(l.mobile).replace(/\D/g, '').indexOf(qd) >= 0)) return false;
      }
      return true;
    });
  }
  function renderLeads() {
    var list = filtered(), all = L.all;
    var hot = all.filter(function (l) { return l.temp === 'hot'; }).length, calls = all.filter(function (l) { return l.callBack; }).length;
    $('#stats').textContent = all.length + ' leads · ' + hot + ' hot · ' + calls + ' call back' + (list.length !== all.length ? ' · showing ' + list.length : '');
    var c = $('#leadCount'); c.textContent = all.length; show(c, all.length > 0);
    if (!list.length) { $('#leadList').innerHTML = '<div class="empty">' + (all.length ? 'No leads match.' : 'No leads yet. Scan a card on the Card Scan tab.') + '</div>'; return; }
    $('#leadList').innerHTML = list.map(function (l, i) {
      var digits = String(l.mobile).replace(/\D/g, ''), key = digits;
      var tags = '<span class="tg src">' + esc(l.source) + (l.staff ? ' · ' + esc(l.staff) : '') + '</span>'
        + (l.temp ? '<span class="tg ' + esc(l.temp) + '">' + esc(l.temp.charAt(0).toUpperCase() + l.temp.slice(1)) + '</span>' : '')
        + (l.callBack ? '<span class="tg call">Call back</span>' : '') + (l.optOut ? '<span class="tg">Opted out</span>' : '') + (l.error ? '<span class="tg err">Send failed</span>' : '');
      var rows = [['Designation', l.designation], ['Email', l.email], ['Visitor', l.visitorType], ['Interested', (l.interests || []).join(', ')],
        ['Catalogues sent', (l.catalogues || []).join(', ')], ['Project', [l.projectType, l.qty, l.timeline].filter(Boolean).join(' · ')],
        ['Notes', l.notes], ['Messages', (l.messages || []).join(' | ')], ['Error', l.error], ['First contact', when(l.firstAt)]]
        .filter(function (r) { return r[1]; }).map(function (r) { return '<div><b>' + r[0] + ':</b> ' + esc(r[1]) + '</div>'; }).join('');
      return '<div class="lead"><div class="top" data-k="' + key + '"><div><div class="nm">' + esc(l.name || l.waName || l.mobile) + '</div>'
        + '<div class="sub">' + esc([l.company, l.city].filter(Boolean).join(' · ') || l.mobile) + '</div><div class="tags">' + tags + '</div></div>'
        + '<div class="when">' + esc(when(l.lastAt)) + '</div></div>'
        + (L.open[key] ? '<div class="more">' + '<div><b>Mobile:</b> ' + esc(l.mobile) + '</div>' + rows + '</div>' : '')
        + '<div class="acts"><a class="btn" href="tel:+' + digits + '">📞 Call</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + digits + '">WhatsApp</a>'
        + '<button class="btn green" data-send="' + key + '">📄 Send catalogue</button></div>'
        + (L.send === key ? sendBox(l, key) : '') + '</div>';
    }).join('');
  }
  function sendBox(l, key) {
    var sel = L.pick || {};
    return '<div class="sendbox"><div class="lbl">Catalogues to send to ' + esc(l.name || l.mobile) + '</div><div class="chips">'
      + DIVS.map(function (d) { var done = (l.catalogues || []).indexOf(d[1]) >= 0;
        return '<button type="button" class="chip" data-pick="' + d[0] + '" aria-pressed="' + !!sel[d[0]] + '">' + esc(d[1]) + (done ? ' <small>(sent)</small>' : '') + '</button>'; }).join('')
      + '</div><div class="acts"><button class="btn" data-cancel="1">Cancel</button><button class="btn primary" data-go="' + key + '">Send now</button></div>'
      + (L.sendMsg ? '<div class="sendmsg">' + L.sendMsg + '</div>' : '') + '</div>';
  }
  $('#leadList').addEventListener('click', async function (e) {
    var x;
    if ((x = e.target.closest('[data-send]'))) { L.send = L.send === x.dataset.send ? null : x.dataset.send; L.pick = {}; L.sendMsg = ''; renderLeads(); return; }
    if ((x = e.target.closest('[data-pick]'))) { L.pick[x.dataset.pick] = !L.pick[x.dataset.pick]; x.setAttribute('aria-pressed', !!L.pick[x.dataset.pick]); return; }
    if (e.target.closest('[data-cancel]')) { L.send = null; renderLeads(); return; }
    if ((x = e.target.closest('[data-go]'))) {
      var ids = Object.keys(L.pick).filter(function (k) { return L.pick[k]; });
      if (!ids.length) { L.sendMsg = '<span class="bad">Tap at least one catalogue.</span>'; renderLeads(); return; }
      var lead = L.all.filter(function (l) { return String(l.mobile).replace(/\D/g, '') === x.dataset.go; })[0] || {};
      x.disabled = true; x.textContent = 'Sending…';
      try {
        var d = await api('/.netlify/functions/team', { action: 'send', key: S.key, staff: S.staff, mobile: lead.mobile, name: lead.name, ids: ids });
        var okN = (d.sent || []).filter(function (s) { return s.ok; });
        var bad = (d.sent || []).filter(function (s) { return !s.ok; });
        var msg = okN.length ? '<span class="good">✓ Sent on WhatsApp: ' + esc(okN.map(function (s) { return s.title; }).join(', ')) + '</span>' : '';
        if (bad.length) msg += '<div class="bad">Not sent: ' + esc(bad.map(function (s) { return s.title; }).join(', ')) + '</div>';
        if (d.note) msg += '<div>' + esc(d.note) + '</div>';
        if (d.waLink) msg += '<a class="btn green" style="margin-top:8px" target="_blank" rel="noopener" href="' + esc(d.waLink) + '">Send links from my WhatsApp</a>';
        L.sendMsg = msg;
        if (okN.length) okN.forEach(function (s) { if ((lead.catalogues || []).indexOf(s.title) < 0) (lead.catalogues = lead.catalogues || []).push(s.title); });
      } catch (err) { L.sendMsg = '<span class="bad">' + esc(err.message) + '</span>'; }
      renderLeads(); return;
    }
    var t = e.target.closest('.top'); if (!t) return; L.open[t.dataset.k] = !L.open[t.dataset.k]; renderLeads();
  });
  $('#q').addEventListener('input', renderLeads);
  $('#srcF').addEventListener('change', renderLeads);
  $('#tempF').addEventListener('click', function (e) {
    var b = e.target.closest('.fchip'); if (!b) return; L.temp = b.dataset.f;
    document.querySelectorAll('#tempF .fchip').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); renderLeads();
  });
  $('#refreshBtn').addEventListener('click', loadLeads);
  $('#csvBtn').addEventListener('click', function () {
    var cols = [['Name','name'],['WhatsApp name','waName'],['Mobile','mobile'],['Company','company'],['Designation','designation'],['City','city'],['Email','email'],
      ['Source','source'],['Staff','staff'],['Temperature','temp'],['Visitor type','visitorType'],['Interested','interests'],['Catalogues sent','catalogues'],
      ['Project type','projectType'],['Quantity','qty'],['Timeline','timeline'],['Notes','notes'],['Call back','callBack'],['First contact','firstAt'],['Last contact','lastAt']];
    var cell = function (v) { v = Array.isArray(v) ? v.join('; ') : (v === true ? 'Yes' : v === false ? '' : (v == null ? '' : String(v))); if (/^[=@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"'; };
    var lines = [cols.map(function (c) { return cell(c[0]); }).join(',')].concat(filtered().map(function (l) { return cols.map(function (c) { return cell(l[c[1]]); }).join(','); }));
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ronch-leads-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  });

  /* ---------- start ---------- */
  var k = ls('rt_key'), n = ls('rt_staff');
  if (n) $('#lgName').value = n;
  if (k && n) login(k, n, true); else show($('#loginView'), true);
})();
</script>
</body>
</html>
